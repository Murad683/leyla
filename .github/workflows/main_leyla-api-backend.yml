name: Deploy leyla to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: leyla-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 12m
          script: bash /opt/leyla/deploy/deploy.sh
